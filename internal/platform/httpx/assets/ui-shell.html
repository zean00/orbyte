<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5f">
  <link rel="manifest" href="/ui/manifest.webmanifest">
  <title>Orbyte Platform UI</title>
  <link rel="stylesheet" href="/ui/assets/platform.css?v={{PLATFORM_ASSET_VERSION}}">
  <style>
    [data-density="compact"] .data-table th,
    [data-density="compact"] .data-table td { padding: .55rem .65rem; font-size: .8125rem; }
    [data-density="compact"] .toolbar-row { gap: .5rem; }
    [data-density="compact"] .control-tile { min-width: 140px; }
    [data-route-focus]:focus, button:focus, a:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #1f6f5f; outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="shell-bar" id="shell-bar">
    <div class="shell-bar-primary">
      <button type="button" id="shell-nav-toggle" class="shell-icon-button" aria-expanded="true" aria-controls="shell-sidebar">Menu</button>
      <div class="shell-brand-cluster">
        <div class="shell-eyebrow" id="shell-eyebrow">Workspace</div>
        <div>
          <h1 class="brand" id="shell-brand">Orbyte Platform UI</h1>
          <p class="subtitle" id="shell-subtitle">Manifest-driven shell with generic pages and module custom entries.</p>
        </div>
      </div>
    </div>
    <div class="shell-bar-actions">
      <form id="shell-command-form" class="shell-command" role="search">
        <input id="shell-command-input" name="shell_command" aria-label="Search pages or jump to a route" list="shell-route-options" placeholder="Search pages or jump to a route">
        <datalist id="shell-route-options"></datalist>
        <button type="submit" class="secondary" id="shell-command-submit">Go</button>
      </form>
      <div class="shell-user-chip" id="shell-user-chip">user</div>
      <label class="locale-switch">
        <span id="locale-label">Language</span>
        <select id="locale-switcher" name="locale"></select>
      </label>
      <button type="button" id="agent-toggle-button" class="secondary" hidden>Agent</button>
      <a id="admin-link-button" class="button secondary" href="/admin" hidden>Admin</a>
      <button type="button" id="logout-button" class="secondary" hidden>Log out</button>
    </div>
  </header>
  <div class="shell-backdrop" id="shell-backdrop" hidden></div>
  <div class="shell workspace-shell" id="shell-root">
    <aside class="sidebar" id="shell-sidebar">
      <div class="sidebar-section sidebar-intro">
        <div class="sidebar-heading">Surfaces</div>
        <div id="surface-switcher" class="surface-switcher" hidden></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">Navigation</div>
        <nav id="menu" class="menu-list" aria-label="Workspace navigation"></nav>
      </div>
    </aside>
    <main class="content">
      <div class="route-panel" id="route-panel">
        <div class="route-copy">
          <div class="route-meta">
            <span class="badge subtle" id="route-floorplan">worklist</span>
            <span class="badge subtle" id="route-module">module</span>
          </div>
          <div id="route-title"><h2>Loading…</h2></div>
          <p class="status" id="route-status">Resolving module UI registry.</p>
        </div>
        <div class="status-bar">
          <span class="badge"><strong id="network-status">online</strong></span>
          <span class="badge">sync <strong id="sync-status">0 pending</strong></span>
          <span class="badge">cache <strong id="cache-status">cold</strong></span>
        </div>
      </div>
      <div id="view-root"></div>
    </main>
  </div>
  <aside id="agent-panel" class="agent-panel hidden" aria-live="polite"></aside>

    function normalizeLocale(locale) {
      const value = String(locale || '').trim().toLowerCase().replace(/_/g, '-');
      if (!value) return 'en';
      if (value === 'id' || value.indexOf('id-') === 0) return 'id';
      return 'en';
    }

    function detectPreferredLocale() {
      if (navigator.languages && navigator.languages.length) return normalizeLocale(navigator.languages[0]);
      return normalizeLocale(navigator.language || 'en');
    }

    function t(key) {
      const locale = state.locale || 'en';
      return (uiMessages[locale] && uiMessages[locale][key]) || (uiMessages.en && uiMessages.en[key]) || key;
    }

    function pickText(item, baseField) {
      if (!item) return '';
      const localized = item[baseField + '_i18n'];
      if (localized && typeof localized === 'object') {
        const current = localized[state.locale];
        if (current) return current;
        if (localized.en) return localized.en;
        if (localized.id) return localized.id;
      }
      return item[baseField] || '';
    }

    function humanizeToken(value) {
      const raw = String(value == null ? '' : value).trim();
      if (!raw) return '';
      if (/[A-Z]/.test(raw) || raw.indexOf(' ') >= 0 || !/^[a-z0-9_-]+$/.test(raw)) return raw;
      return raw.split(/[_-]+/).filter(Boolean).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
    }

    function translateToken(prefix, value) {
      const raw = String(value == null ? '' : value).trim();
      if (!raw) return '';
      const key = prefix + '_' + raw.toLowerCase().replace(/[^a-z0-9]+/g, '_');
      const translated = t(key);
      if (translated !== key) return translated;
      return humanizeToken(raw);
    }

    function displayValue(value) {
      if (value == null) return '';
      if (typeof value === 'boolean') return t(value ? 'value_true' : 'value_false');
      if (typeof value === 'number') return String(value);
      if (typeof value === 'string') return translateToken('value', value);
      return String(value);
    }

    async function persistLocale(locale) {
      try {
        const response = await fetch('/locale?locale=' + encodeURIComponent(locale), {credentials: 'same-origin'});
        if (!response.ok) throw new Error('locale update failed');
        const payload = await response.json();
        state.locale = normalizeLocale(payload.locale || locale);
        state.supportedLocales = payload.supported_locales || state.supportedLocales || defaultSupportedLocales;
      } catch (_) {
        state.locale = normalizeLocale(locale);
      }
    }

    function escapeHTML(value) {
      return String(value == null ? '' : value).replace(/[&<>"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    }

    function enhanceControlAccessibility(root) {
      const scope = root || document;
      scope.querySelectorAll('input, select, textarea').forEach((field, index) => {
        if (!field.name) {
          field.name = field.id || field.dataset.path || field.dataset.filter || field.dataset.worklistFilter || field.dataset.columnToggle || ('field_' + index);
        }
        if (field.getAttribute('aria-label')) return;
        const wrappingLabel = field.closest('label');
        let labelText = '';
        if (wrappingLabel) labelText = wrappingLabel.textContent || '';
        if (!labelText && field.id) {
          const explicitLabel = scope.querySelector('label[for="' + field.id + '"]');
          if (explicitLabel) labelText = explicitLabel.textContent || '';
        }
        if (!labelText && field.placeholder) labelText = field.placeholder;
        if (!labelText && field.dataset.filter) labelText = field.dataset.filter.replace(/_/g, ' ');
        if (!labelText && field.dataset.worklistFilter) labelText = field.dataset.worklistFilter.replace(/_/g, ' ');
        if (!labelText && field.dataset.path) labelText = field.dataset.path.split('.').pop();
        if (labelText) field.setAttribute('aria-label', labelText.replace(/\s+/g, ' ').trim());
      });
    }

      document.documentElement.lang = state.locale;
      document.title = t('shell_brand');
      const eyebrow = document.getElementById('shell-eyebrow');
      const brand = document.getElementById('shell-brand');

      const routeStatus = document.getElementById('route-status');

      if (brand) brand.textContent = t('shell_brand');
      if (subtitle) subtitle.textContent = t('shell_subtitle');
      if (localeLabel) localeLabel.textContent = t('locale_label');
      if (adminLinkButton) adminLinkButton.textContent = t('admin_link');
      if (logoutButton) logoutButton.textContent = t('logout');
      if (commandInput) commandInput.placeholder = t('shell_search_placeholder');
      if (commandSubmit) commandSubmit.textContent = t('shell_search_go');
      if (userChip) userChip.textContent = state.bootstrap && state.bootstrap.auth_context ? (t('shell_user_chip') + ' · ' + (state.bootstrap.auth_context.effective_user_id || state.bootstrap.auth_context.actor_user_id || 'user')) : t('shell_user_chip');
      if (routeTitle && !state.route) routeTitle.innerHTML = '<h2>' + escapeHTML(t('loading')) + '</h2>';
      if (routeStatus && !state.route) routeStatus.textContent = t('route_resolving');
      refreshOfflineStatus();
    }

    function loadShellPrefs() {
      try {
        const stored = window.localStorage.getItem('orbyte.ui.navCollapsed');
        state.navCollapsed = stored == null ? window.innerWidth < 1024 : stored === '1';
      } catch (_) {
        state.navCollapsed = window.innerWidth < 1024;
      }
    }

    function persistShellPrefs() {
      try {
        window.localStorage.setItem('orbyte.ui.navCollapsed', state.navCollapsed ? '1' : '0');
      } catch (_) {}
    }

    function applyWorkspaceNavState() {
      const shell = document.getElementById('shell-root');
      const sidebar = document.getElementById('shell-sidebar');
      const toggle = document.getElementById('shell-nav-toggle');
      const backdrop = document.getElementById('shell-backdrop');
      if (shell) shell.classList.toggle('nav-collapsed', !!state.navCollapsed);
      if (sidebar) sidebar.classList.toggle('open', !state.navCollapsed);
      if (toggle) toggle.setAttribute('aria-expanded', String(!state.navCollapsed));
      if (backdrop) backdrop.hidden = state.navCollapsed || window.innerWidth >= 1024;
    }

    function bindWorkspaceShellControls() {
      const toggle = document.getElementById('shell-nav-toggle');
      const backdrop = document.getElementById('shell-backdrop');
      const commandForm = document.getElementById('shell-command-form');
      const commandInput = document.getElementById('shell-command-input');
      if (toggle && !toggle.dataset.bound) {
        toggle.dataset.bound = '1';
        toggle.addEventListener('click', () => {
          state.navCollapsed = !state.navCollapsed;
          persistShellPrefs();
          applyWorkspaceNavState();
        });
      }
      if (backdrop && !backdrop.dataset.bound) {
        backdrop.dataset.bound = '1';
        backdrop.addEventListener('click', () => {
          state.navCollapsed = true;
          persistShellPrefs();
          applyWorkspaceNavState();
        });
      }
      if (commandForm && !commandForm.dataset.bound) {
        commandForm.dataset.bound = '1';
        commandForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const raw = (commandInput && commandInput.value || '').trim();
          if (!raw) return;
          const staticRoutes = [];
          if (state.bootstrap && state.bootstrap.acp && state.bootstrap.acp.enabled) {
            staticRoutes.push({label: 'Agent Workspace', route_path: '/agent/workspace'});
          }
          const match = (((state.bootstrap || {}).actions) || []).find((item) => item.route_path === raw || pickText(item, 'label').toLowerCase() === raw.toLowerCase()) ||
            staticRoutes.find((item) => item.route_path === raw || item.label.toLowerCase() === raw.toLowerCase());
          const target = match ? match.route_path : raw;
          window.location.hash = target.startsWith('#') ? target : ('#' + target);
          if (window.innerWidth < 1024) {
            state.navCollapsed = true;
            persistShellPrefs();
            applyWorkspaceNavState();

      const sidebar = document.getElementById('shell-sidebar');
      const routePanel = document.getElementById('route-panel');
      const content = document.querySelector('.content');

    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      try {
        await navigator.serviceWorker.register('/ui/sw.js', {scope: '/ui/'});
      } catch (_) {}
    }

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(offlineDBName, offlineDBVersion);
        request.onupgradeneeded = () => {
          const db = request.result;
          ['app_meta', 'contracts', 'reference_packages', 'projection_packages', 'drafts', 'sync_queue', 'sync_results', 'records'].forEach((storeName) => {
            if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName);
          });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('indexeddb unavailable'));
      });
    }

    async function idbPut(storeName, key, value) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(value, key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error || new Error('indexeddb write failed')); };
      });
    }

    async function idbGet(storeName, key) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => { db.close(); resolve(req.result || null); };
        req.onerror = () => { db.close(); reject(req.error || new Error('indexeddb read failed')); };
      });
    }

    async function idbDelete(storeName, key) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(key);
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error || new Error('indexeddb delete failed')); };
      });
    }

    async function idbClear(storeName) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => { db.close(); resolve(); };
        tx.onerror = () => { db.close(); reject(tx.error || new Error('indexeddb clear failed')); };
      });
    }

    async function idbEntries(storeName) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => { db.close(); resolve(req.result || []); };
        req.onerror = () => { db.close(); reject(req.error || new Error('indexeddb list failed')); };
      });
    }

    function cachedResponseKey(path) {
      return 'response:' + path;
    }

    function shouldCacheResponse(path, options) {
      const method = ((options && options.method) || 'GET').toUpperCase();
      if (method !== 'GET') return false;
      return path === '/auth/options' ||
        path === '/ui/bootstrap' ||
        path.indexOf('/ui/routes/resolve') === 0 ||
        path.indexOf('/ui/views/') === 0 ||
        path.indexOf('/ui/data/') === 0;
    }

    function isNetworkError(err) {
      const message = String((err && err.message) || err || '').toLowerCase();
      return !message || message.indexOf('failed to fetch') >= 0 || message.indexOf('network') >= 0 || message.indexOf('load failed') >= 0;
    }

    async function rememberResponse(path, payload, kind) {
      await idbPut('contracts', cachedResponseKey(path), {
        payload,
        kind,
        updated_at: new Date().toISOString()
      });
      state.cacheWarm = true;
      refreshOfflineStatus();
    }

    async function loadCachedResponse(path) {
      const cached = await idbGet('contracts', cachedResponseKey(path));
      return cached ? cached.payload : null;
    }

    async function api(path, options) {
      const requestOptions = Object.assign({credentials: 'same-origin'}, options || {});
      const method = String(requestOptions.method || 'GET').toUpperCase();
      if (method !== 'GET' && method !== 'HEAD') {
        const headers = Object.assign({}, requestOptions.headers || {});
        if (!headers['X-CSRF-Token']) {
          const csrf = readCookie('orbyte_csrf');
          if (csrf) headers['X-CSRF-Token'] = csrf;
        }
        requestOptions.headers = headers;
      }
      try {
        const response = await fetch(path, requestOptions);
        if (!response.ok) {
          let message = response.statusText;
          try {
            const payload = await response.json();
            message = payload.error && payload.error.message ? payload.error.message : message;
          } catch (_) {}
          throw new Error(message);
        }
        const contentType = response.headers.get('content-type') || '';
        const payload = contentType.includes('application/json') ? await response.json() : await response.text();
        if (shouldCacheResponse(path, requestOptions)) {
          await rememberResponse(path, payload, contentType.includes('application/json') ? 'json' : 'text');
        }
        return payload;
      } catch (err) {
        if (shouldCacheResponse(path, requestOptions) && (isNetworkError(err) || !navigator.onLine)) {
          const cached = await loadCachedResponse(path);
          if (cached != null) {
            setStatus(t('using_cached_data') + ' ' + path + '.');
            return cached;
          }
        }
        throw err;
      }
    }

    function currentPath() {
      const raw = window.location.hash.replace(/^#/, '');
      if (!raw) return '';
      const qIndex = raw.indexOf('?');
      return qIndex >= 0 ? raw.slice(0, qIndex) : raw;
    }

    function currentParams() {
      const raw = window.location.hash.replace(/^#/, '');
      const qIndex = raw.indexOf('?');
      return new URLSearchParams(qIndex >= 0 ? raw.slice(qIndex + 1) : '');
    }

    function currentSurface() {
      const params = new URLSearchParams(window.location.search);
      const value = String(params.get('surface') || state.surface || 'backoffice').trim().toLowerCase();
      if (value === 'worklist' || value === 'self_service' || value === 'pos' || value === 'mobile' || value === 'admin') return value;
      return 'backoffice';
    }

    function bootstrapURL() {
      return '/ui/bootstrap?surface=' + encodeURIComponent(currentSurface());
    }

    function preferenceStorageKey(pathname) {
      return 'orbyte:ui-prefs:' + currentSurface() + ':' + pathname;
    }

    function worklistFilterStorageKey(pathname, source) {
      return 'orbyte:worklist-filter:' + currentSurface() + ':' + pathname + ':' + source;
    }

    function readLocalUIPreferences(pathname) {
      try {
        const raw = window.localStorage.getItem(preferenceStorageKey(pathname));
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch (_) {
        return null;
      }
    }

    function writeLocalUIPreferences(pathname, prefs) {
      try {
        const payload = Object.assign({surface: currentSurface(), route_path: pathname}, prefs || {});
        const hasColumns = Array.isArray(payload.columns) && payload.columns.length > 0;
        const hasColumnOrder = Array.isArray(payload.column_order) && payload.column_order.length > 0;
        if ((!payload.filters || !Object.keys(payload.filters).length) && !hasColumns && !hasColumnOrder && !payload.density) {
          window.localStorage.removeItem(preferenceStorageKey(pathname));
          return;
        }
        window.localStorage.setItem(preferenceStorageKey(pathname), JSON.stringify(payload));
      } catch (_) {}
    }

    function readSavedWorklistFilter(pathname, source) {
      const prefs = readLocalUIPreferences(pathname);
      const filters = prefs && prefs.filters && prefs.filters[source];
      return filters && typeof filters === 'object' ? filters : null;
    }

    async function loadUIPreferences(pathname, viewKey) {
      const routePath = pathname || currentPath();
      if (!routePath) return {surface: currentSurface(), route_path: routePath, filters: {}, columns: [], column_order: [], density: 'comfortable'};
      try {
        const payload = await api('/me/preferences/ui?surface=' + encodeURIComponent(currentSurface()) + '&route_path=' + encodeURIComponent(routePath));
        const merged = Object.assign({filters: {}, columns: [], column_order: [], density: 'comfortable'}, payload || {});
        if (viewKey && !merged.view_key) merged.view_key = viewKey;
        writeLocalUIPreferences(routePath, merged);
        return merged;
      } catch (_) {
        const local = readLocalUIPreferences(routePath);
        return Object.assign({surface: currentSurface(), route_path: routePath, view_key: viewKey || '', filters: {}, columns: [], column_order: [], density: 'comfortable'}, local || {});
      }
    }

    async function saveUIPreferences(pathname, nextPrefs) {
      const routePath = pathname || currentPath();
      const payload = Object.assign({surface: currentSurface(), route_path: routePath, filters: {}, columns: [], column_order: [], density: 'comfortable'}, nextPrefs || {});
      writeLocalUIPreferences(routePath, payload);
      try {
        await api('/me/preferences/ui', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
      } catch (_) {}
      setStatus(t('preferences_saved'));
      return payload;
    }

    async function saveWorklistFilterPreference(pathname, source, params, viewKey) {
      const current = await loadUIPreferences(pathname, viewKey);
      const filters = Object.assign({}, current.filters || {});
      const next = {};
      Object.keys(params || {}).forEach((key) => {
        if (params[key]) next[key] = params[key];
      });
      if (Object.keys(next).length) filters[source] = next; else delete filters[source];
      return saveUIPreferences(pathname, Object.assign({}, current, {view_key: viewKey || current.view_key || '', filters}));
    }

    function paramsFromObject(values) {
      const params = new URLSearchParams();
      Object.keys(values || {}).forEach((key) => {
        if (values[key]) params.set(key, values[key]);
      });
      return params;
    }

    function routeForWorkItem(item, fallbackDocumentType) {
      if (!item) return '';
      if (item.target_type === 'document') {
        const detailRoute = routeForDocument(item.document_type || fallbackDocumentType || 'generic_request', 'detail');
        if (!detailRoute || !item.target_id) return '';
        const params = new URLSearchParams();
        params.set('id', item.target_id);
        if (item.id) params.set('work_item_id', item.id);
        params.set('work_item_kind', item.stage_key ? 'approval' : 'task');
        return detailRoute + '?' + params.toString();
      }
      return '';

    function setStatus(text) {

    function floorplanForRoute(route) {
      if (!route) return 'workspace';
      if (route.render_mode === 'flow') return 'editor';
      const view = route.view || {};
      if (view.kind === 'list' || view.kind === 'queue') return 'worklist';
      if (view.kind === 'detail') return 'object';
      if (view.kind === 'form') return 'editor';
      if (view.kind === 'dashboard') return 'dashboard';
      if (route.render_mode === 'custom') return 'dashboard';
      return 'workspace';

    function renderFilterChips(params, keys) {

    function updateRoutePanel(route) {
      const floorplanNode = document.getElementById('route-floorplan');

    function setRouteState(kind, focusSelector) {
      state.routeState = kind;
      state.routeFocusSelector = focusSelector || '';
    }

    function focusRecoveryTarget(selector) {
      window.requestAnimationFrame(() => {
        const node = document.querySelector(selector || state.routeFocusSelector || '[data-route-focus]');
        if (!node) return;
        if (!node.hasAttribute('tabindex')) node.setAttribute('tabindex', '-1');
        node.focus();
      });
    }

    function routeFallbackPath(surface) {
      const targetSurface = surface || currentSurface();
      const paths = (state.bootstrap && state.bootstrap.fallback_paths) || {};
      return paths[targetSurface] || (targetSurface === state.surface ? state.bootstrap && state.bootstrap.default_path : '');
    }

    async function navigateToSurface(surface, preferredPath) {
      const params = new URLSearchParams(window.location.search);
      params.set('surface', surface || 'backoffice');
      const targetPath = preferredPath || ((state.bootstrap && state.bootstrap.fallback_paths && state.bootstrap.fallback_paths[surface]) || '');
      const target = '/ui?' + params.toString() + (targetPath ? '#' + targetPath : '');
      window.location.assign(target);
    }

    async function resolveCurrentRoute() {
      const path = currentPath() || (state.bootstrap && state.bootstrap.default_path) || '';
      if (!path) {
        return {status: 'not_found', requested_path: '', surface: currentSurface(), fallback_path: routeFallbackPath(currentSurface()), message: t('no_routes')};
      }
      return api('/ui/routes/resolve?path=' + encodeURIComponent(path) + '&surface=' + encodeURIComponent(state.surface || currentSurface()));
    }

    function refreshOfflineStatus() {
      const networkNode = document.getElementById('network-status');
      const syncNode = document.getElementById('sync-status');
      const cacheNode = document.getElementById('cache-status');
      if (networkNode) networkNode.textContent = navigator.onLine ? t('online') : t('offline');
      if (syncNode) syncNode.textContent = state.syncStats.pending + ' ' + t('sync_pending') + ' / ' + state.syncStats.conflict + ' ' + t('sync_conflict') + ' / ' + state.syncStats.failed + ' ' + t('sync_failed');
      if (cacheNode) cacheNode.textContent = state.cacheWarm ? t('cache_warm') : t('cache_cold');
    }

    function renderRecoveryPanel(title, message, actions) {
      const root = document.getElementById('view-root');
      root.innerHTML = '<section class="page-panel" aria-live="polite"><div class="page-header"><div><h3 data-route-focus>' + escapeHTML(title) + '</h3><p class="status">' + escapeHTML(message) + '</p></div></div><div class="page-actions" id="route-recovery-actions"></div></section>';
      const zone = document.getElementById('route-recovery-actions');
      (actions || []).forEach((action, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        if (action.secondary) button.className = 'secondary';
        button.textContent = action.label;
        button.onclick = action.onClick;
        if (index === 0) button.dataset.routeFocus = '1';
        zone.appendChild(button);
      });
      setRouteState('recovery', '[data-route-focus]');
      focusRecoveryTarget('[data-route-focus]');

    function bindGlobalShortcuts() {
      document.addEventListener('keydown', (event) => {
        if ((event.target && /input|textarea|select/i.test(event.target.tagName)) || event.defaultPrevented) return;
        if (event.key === '/') {
          const target = document.querySelector('[data-primary-filter]');
          if (target) {
            event.preventDefault();
            target.focus();
          }
          return;
        }
        if (event.key === 'g' && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          const fallback = routeFallbackPath(currentSurface());
          if (fallback) window.location.hash = '#' + fallback;
        }
      });
    }

    function requestedUIRoute() {

    function requestedUIHref() {
      const path = requestedUIRoute();
      const query = new URLSearchParams(window.location.search);
      query.set('surface', currentSurface());
      const base = '/ui' + (query.toString() ? '?' + query.toString() : '');

    function offlineDocumentCapability(documentType) {
      return (state.offlineBootstrap && state.offlineBootstrap.documents || []).find((item) => item.type === documentType) || null;
    }

    function offlineModelCapability(modelKey) {

    }

    function offlineProjectionCapabilityForView(view) {
      if (!state.offlineBootstrap || !state.offlineBootstrap.projections) return null;
      if (view.projection_key) {
        return state.offlineBootstrap.projections.find((item) => item.index_key.indexOf('documents.') === 0) || null;
      }
      if (view.model_key) {
        return state.offlineBootstrap.projections.find((item) => item.index_key.indexOf(view.model_key) >= 0 || item.title.toLowerCase().indexOf(view.model_key) >= 0) || null;
      }

    function draftKey(kind, targetKey, targetID) {
      return [kind, targetKey, targetID || 'new'].join(':');
    }

    async function loadDraft(kind, targetKey, targetID) {
      return idbGet('drafts', draftKey(kind, targetKey, targetID));
    }

    async function saveDraft(kind, targetKey, targetID, draft) {
      const key = draftKey(kind, targetKey, targetID);
      await idbPut('drafts', key, Object.assign({draft_key: key, updated_at: new Date().toISOString()}, draft));
      return key;

    function queueKey(idempotencyKey) {
      return 'queue:' + idempotencyKey;
    }

    async function offlineDeviceID() {
      let deviceID = '';
      try {
        deviceID = window.localStorage.getItem('orbyte.offline.device_id') || '';
      } catch (_) {}
      if (!deviceID) {
        deviceID = 'offline-device-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        try {
          window.localStorage.setItem('orbyte.offline.device_id', deviceID);
        } catch (_) {}
      }
      return deviceID;
    }

    async function queueSyncItem(item) {
      const idempotencyKey = item.idempotency_key || ('sync-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      item.idempotency_key = idempotencyKey;
      await idbPut('sync_queue', queueKey(idempotencyKey), Object.assign({
        queued_at: new Date().toISOString(),
        attempt_count: Number(item.attempt_count || 0),
        next_retry_at: item.next_retry_at || ''
      }, item));
      await refreshSyncStats();
      return item;
    }

    async function refreshSyncStats() {
      const queued = await idbEntries('sync_queue');
      const drafts = await idbEntries('drafts');
      state.syncStats.pending = queued.length;
      state.syncStats.conflict = drafts.filter((item) => item && item.status === 'conflict').length;
      state.syncStats.failed = drafts.filter((item) => item && (item.status === 'failed' || item.status === 'failed_retryable' || item.status === 'failed_terminal' || item.status === 'forbidden')).length;
      refreshOfflineStatus();
    }

    async function rememberProjectionPackage(pkg) {
      await idbPut('projection_packages', pkg.package_key, pkg);
    }

    async function rememberReferencePackage(pkg) {
      await idbPut('reference_packages', pkg.package_key, pkg);
    }

    async function prefetchOfflinePackages() {
      if (!state.offlineBootstrap) return;
      for (const item of (state.offlineBootstrap.references || [])) {
        try {
          const pkg = await api('/offline/packages/references', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({type_key: item.type_key})
          });
          await rememberReferencePackage(pkg);
        } catch (_) {}
      }
      for (const item of (state.offlineBootstrap.projections || [])) {
        try {
          const pkg = await api('/offline/packages/projections', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({index_key: item.index_key, query: {page: 1, page_size: 100, include_fields: item.default_include_fields || []}})
          });
          await rememberProjectionPackage(pkg);
        } catch (_) {}
      }
    }

    async function loadOfflineBootstrap() {
      const cached = await idbGet('app_meta', 'offline_bootstrap');
      try {
        state.offlineBootstrap = await api('/offline/bootstrap');
        if (cached && (cached.cache_token !== state.offlineBootstrap.cache_token || cached.schema_version !== state.offlineBootstrap.schema_version)) {
          await Promise.all([
            idbClear('reference_packages'),
            idbClear('projection_packages')
          ]);
        }
        await idbPut('app_meta', 'offline_bootstrap', state.offlineBootstrap);
        await prefetchOfflinePackages();
      } catch (err) {
        state.offlineBootstrap = cached;
      }
      return state.offlineBootstrap;
    }

    async function projectionFallback(view) {
      const capability = offlineProjectionCapabilityForView(view);
      if (!capability) return null;
      const pkg = await idbGet('projection_packages', 'projection:' + capability.index_key);
      if (!pkg || !pkg.result || !Array.isArray(pkg.result.hits)) return null;
      if (view.model_key) {
        return {
          items: pkg.result.hits.map((hit) => ({
            id: hit.source_id,
            model_key: view.model_key,
            values: Object.assign({}, hit.fields || {})
          })),
          total: pkg.result.total || pkg.result.hits.length
        };
      }
      return {
        items: pkg.result.hits.map((hit) => ({
          header: {
            id: hit.fields && (hit.fields.document_id || hit.source_id) || hit.source_id,
            type: hit.fields && hit.fields.document_type || view.document_type || '',
            status: hit.fields && hit.fields.status || '',
            updated_at: hit.fields && hit.fields.updated_at || '',
            etag: hit.fields && hit.fields.etag || '',
            version: hit.fields && hit.fields.version || 0
          },
          body: {payload: hit.fields || {}}
        })),
        total: pkg.result.total || pkg.result.hits.length
      };
    }

    async function processSyncQueue() {
      if (!navigator.onLine) {
        await refreshSyncStats();
        return;
      }
      const now = Date.now();
      const queued = (await idbEntries('sync_queue')).filter((item) => {
        if (!item) return false;
        if (!item.next_retry_at) return true;
        const retryAt = Date.parse(item.next_retry_at);
        return Number.isNaN(retryAt) || retryAt <= now;
      });
      if (!queued.length) {
        await refreshSyncStats();
        return;
      }
      try {
        const deviceID = await offlineDeviceID();
        const payload = await api('/offline/sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Offline-Device-ID': deviceID},
          body: JSON.stringify({items: queued})
        });
        const results = payload.items || [];
        for (const result of results) {
          const key = queueKey(result.idempotency_key);
          const queueItem = await idbGet('sync_queue', key);
          if (!queueItem) continue;
          const targetKey = queueItem.kind === 'model' ? queueItem.model_key : queueItem.document_type;
          const draft = await loadDraft(queueItem.kind, targetKey, queueItem.target_id);
          if (result.status === 'accepted') {
            if (draft) {
              draft.status = 'accepted';
              draft.target_id = result.target_id || draft.target_id || '';
              draft.version = result.version || draft.version || 0;
              draft.etag = result.etag || draft.etag || '';
              draft.last_error = '';
              draft.conflict = null;
              await saveDraft(queueItem.kind, targetKey, draft.target_id || queueItem.target_id, draft);
            }
            await idbDelete('sync_queue', key);
          } else if (result.status === 'conflict') {
            if (draft) {
              draft.status = 'conflict';
              draft.conflict = result.conflict || {};
              draft.last_error = result.error || '';
              await saveDraft(queueItem.kind, targetKey, queueItem.target_id, draft);
            }
            await idbDelete('sync_queue', key);
          } else if (result.status === 'failed_retryable') {
            queueItem.attempt_count = Number(result.attempt_count || queueItem.attempt_count || 0);
            queueItem.next_retry_at = result.retry_after || '';
            queueItem.last_error = result.error || 'sync failed';
            queueItem.last_result_status = result.status;
            await idbPut('sync_queue', key, queueItem);
            if (draft) {
              draft.status = 'failed_retryable';
              draft.last_error = result.error || 'sync failed';
              draft.retry_after = result.retry_after || '';
              await saveDraft(queueItem.kind, targetKey, queueItem.target_id, draft);
            }
          } else {
            if (draft) {
              draft.status = result.status || 'failed_terminal';
              draft.last_error = result.error || 'sync failed';
              draft.retry_after = result.retry_after || '';
              await saveDraft(queueItem.kind, targetKey, queueItem.target_id, draft);
            }
            await idbDelete('sync_queue', key);
          }
          await idbPut('sync_results', result.idempotency_key, result);
        }
      } catch (_) {}
      await refreshSyncStats();
    }

    function findActionByView(predicate) {
      return (state.bootstrap.actions || []).find((action) => {
        if (!action.view_key) return false;
        const view = (state.bootstrap.views || []).find((item) => item.key === action.view_key);
        return !!view && predicate(view);
      }) || null;
    }

    function routeForModel(modelKey, kind) {
      const action = findActionByView((view) => view.model_key === modelKey && view.kind === kind);
      return action ? action.route_path : '';
    }

    function detailViewForDocumentType(documentType) {
      return ((state.bootstrap && state.bootstrap.views) || []).find((view) => view.document_type === documentType && view.kind === 'detail') || null;
    }

    function routeForDocument(documentType, kind) {
      const action = findActionByView((view) => view.document_type === documentType && view.kind === kind);
      return action ? action.route_path : '';
    }

    function routeForFlow(flowKey) {
      const action = (state.bootstrap.actions || []).find((item) => item.render_mode === 'flow' && item.flow_key === flowKey);
      return action ? action.route_path : '';
    }

    function flowForKey(flowKey) {
      return ((state.bootstrap && state.bootstrap.flows) || []).find((item) => item.key === flowKey) || null;
    }

    function routeForDocumentCreate(documentType) {
      const flowAction = (state.bootstrap.actions || []).find((action) => {
        if (action.render_mode !== 'flow' || !action.flow_key) return false;
        const flow = flowForKey(action.flow_key);
        return !!flow && flow.primary_document_type === documentType;
      });
      if (flowAction) return flowAction.route_path;
      return routeForDocument(documentType, 'form');
    }

    function routeForDocumentEdit(record, flowInstance) {
      const instance = flowInstance || null;
      if (instance && instance.flow && instance.primary_document_id) {
        const flowRoute = routeForFlow(instance.flow.key);
        if (flowRoute) {
          const params = new URLSearchParams();
          params.set('id', instance.primary_document_id);
          const activeDocumentKey = currentParams().get('document_key') || ((((record || {}).header || {}).metadata || {}).flow_document_key) || instance.active_document_key || '';
          if (activeDocumentKey) params.set('document_key', activeDocumentKey);
          return flowRoute + '?' + params.toString();
        }
      }
      const formRoute = routeForDocument(record.header.type, 'form');
      if (!formRoute || !record.header.id) return '';
      return formRoute + '?id=' + encodeURIComponent(record.header.id);
    }

    async function loadBundle(bundleKey) {
      if (state.bundles[bundleKey]) return state.bundles[bundleKey];
      const script = document.createElement('script');
      script.src = '/ui/assets/modules/' + encodeURIComponent(bundleKey) + '.js';
      script.async = true;
      const loaded = await new Promise((resolve, reject) => {
        script.onload = resolve;
        script.onerror = () => reject(new Error('failed to load module bundle'));
        document.head.appendChild(script);
      });
      void loaded;
      const bundles = window.ClinicModuleBundles || {};
      if (!bundles[bundleKey]) throw new Error('module bundle not registered');
      state.bundles[bundleKey] = bundles[bundleKey];
      return bundles[bundleKey];
    }

    async function downloadTemplatePDF(renderRequest) {
      const csrf = readCookie('orbyte_csrf');
      const response = await fetch('/outputs/render', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrf},
        body: JSON.stringify(Object.assign({}, renderRequest, {format: 'pdf'}))
      });
      if (!response.ok) {
        let message = 'render failed';
        try {
          const payload = await response.json();
          message = payload.error && payload.error.message ? payload.error.message : message;
        } catch (_) {}
        throw new Error(message);
      }
      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = (response.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/)?.[1] || 'output.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => window.URL.revokeObjectURL(url), 1000);
    }

      state.flowTabs[flowDraftStateKey(flowKey, targetID)] = draft;

    function flowContext(draft) {
      const documents = {};
      Object.keys(draft.documents || {}).forEach((key) => {
        documents[key] = {payload: (draft.documents[key] && draft.documents[key].payload) || {}};
      });
      return {documents};
    }

    function flowPathValue(payload, path) {
      return String(path || '').split('.').reduce((current, key) => current && current[key] != null ? current[key] : '', payload);
    }

    function flowRuleMatches(rule, draft) {
      const value = flowPathValue(flowContext(draft), rule.path);
      if (rule.truthy) return !!value && String(value).toLowerCase() !== 'false';
      if (rule.equals !== undefined && rule.equals !== '') return String(value) === String(rule.equals);
      if (Array.isArray(rule.in) && rule.in.length) return rule.in.map(String).includes(String(value));
      return false;
    }

    function resolveFlowSequence(flow, draft) {
      const steps = flow.steps || [];
      if (!steps.length) return [];
      const stepMap = {};
      steps.forEach((step) => { stepMap[step.key] = step; });
      const sequence = [];
      const seen = {};
      let current = steps[0];
      while (current && !seen[current.key]) {
        seen[current.key] = true;
        sequence.push(current);
        let next = '';
        for (const rule of (current.next_rules || [])) {
          if (flowRuleMatches(rule, draft)) {
            next = rule.next_step_key;
            break;
          }
        }
        if (!next) next = current.next_step_key || '';
        current = next ? stepMap[next] : null;
      }
      return sequence;
    }

    function flowDocumentRecord(docDef, draft) {
      return {
        header: {type: docDef.document_type, status: 'draft'},
        body: {payload: ((draft.documents || {})[docDef.key] && draft.documents[docDef.key].payload) || {}}
      };
    }

    function flowDocumentFields(docDef) {
      const fields = [];
      (docDef.fields || []).forEach((field) => fields.push(field));
      (docDef.sections || []).forEach((section) => {
        (section.fields || []).forEach((field) => fields.push(field));
      });
      (docDef.tabs || []).forEach((tab) => {
        (tab.sections || []).forEach((section) => {
          (section.fields || []).forEach((field) => fields.push(field));
        });
      });
      return fields;
    }

    function applyFlowDraftDefaults(flow, draft) {
      const next = JSON.parse(JSON.stringify(draft || {documents: {}}));
      let changed = false;
      (flow.steps || []).forEach((step) => {
        (step.documents || []).forEach((docDef) => {
          next.documents[docDef.key] = next.documents[docDef.key] || {payload: {}};
          const payload = next.documents[docDef.key].payload || {};
          flowDocumentFields(docDef).forEach((field) => {
            const normalizedPath = String(field.path || '').replace(/^body\.payload\./, '');
            if (!normalizedPath) return;
            const current = resolvePath(payload, normalizedPath);
            if ((current === '' || current == null) && (field.options || []).length > 0) {
              assignPath(payload, normalizedPath, field.options[0]);
              changed = true;
            }
          });
          next.documents[docDef.key].payload = payload;
        });
      });
      return {draft: next, changed};
    }

    function renderFlowDocumentDefinition(docDef, draft) {
      const record = flowDocumentRecord(docDef, draft);
      if ((docDef.tabs || []).length > 0) {
        return (docDef.tabs || []).map((tab) => {
          const sections = (tab.sections || []).map((section) => renderFormSection(section, record)).join('');
          return '<section class="panel"><h3>' + escapeHTML(pickText(tab, 'title')) + '</h3>' + sections + '</section>';
        }).join('');
      }
      if ((docDef.sections || []).length > 0) {
        return (docDef.sections || []).map((section) => renderFormSection(section, record)).join('');
      }
      return '<div class="form-grid">' + (docDef.fields || []).map((field) => renderEditableField(field, record)).join('') + '</div>';
    }

    function collectFlowDraft(root, draft) {
      const next = JSON.parse(JSON.stringify(draft || {documents: {}}));
      root.querySelectorAll('[data-flow-doc-key]').forEach((section) => {
        const docKey = section.dataset.flowDocKey;
        next.documents[docKey] = next.documents[docKey] || {payload: {}};
        const payload = {};
        section.querySelectorAll('[data-path]').forEach((input) => {
          assignPath(payload, input.dataset.path.replace(/^body\.payload\./, ''), readFieldValue(input));
        });
        next.documents[docKey].payload = payload;
      });
      return next;
    }

    function flowDraftFromInstance(instance) {
      const documents = {};
      (instance.items || []).forEach((item) => {
        documents[item.definition.key] = {
          payload: (((item.record || {}).body || {}).payload) || {}
        };
      });
      return {
        documents,
        step_index: 0,
        active_document_key: instance.active_document_key || ''
      };
    }

    function flowStepIndexForDocumentKey(steps, documentKey) {
      if (!documentKey) return 0;
      for (let index = 0; index < (steps || []).length; index += 1) {
        if (((steps[index].documents || []).some((item) => item.key === documentKey))) return index;
      }
      return 0;
    }

    async function renderFlow(route) {
      const root = document.getElementById('view-root');
      const flow = route.flow;
      if (!flow) {
        renderJSONCard(t('view_unavailable'), route);
        return;
      }
      const flowDocumentID = currentParams().get('id') || '';
      const activeDocumentParam = currentParams().get('document_key') || '';
      let draft = await loadFlowDraft(flow.key, flowDocumentID);
      if (flowDocumentID) {
        try {
          const payload = await api('/ui/data/documents/' + encodeURIComponent(flowDocumentID));
          if (payload.flow_instance && payload.flow_instance.flow && payload.flow_instance.flow.key === flow.key) {
            draft = flowDraftFromInstance(payload.flow_instance);
            if (activeDocumentParam) draft.active_document_key = activeDocumentParam;
          }
        } catch (_) {}
      }
      const seeded = applyFlowDraftDefaults(flow, draft);
      draft = seeded.draft;
      if (seeded.changed) {
        await saveFlowDraft(flow.key, flowDocumentID, draft);
      }
      const steps = resolveFlowSequence(flow, draft);
      if (!steps.length) {
        root.innerHTML = '<section class="page-panel"><div class="page-header"><div><h3>' + escapeHTML(pickText(flow, 'title')) + '</h3><p class="status">' + escapeHTML(t('view_unavailable')) + '</p></div></div></section>';
        return;
      }
      let stepIndex = Math.min((activeDocumentParam ? flowStepIndexForDocumentKey(steps, activeDocumentParam) : (draft.step_index || 0)), steps.length - 1);
      const step = steps[stepIndex];
      const activeDocKey = draft.active_document_key && (step.documents || []).some((item) => item.key === draft.active_document_key)
        ? draft.active_document_key
        : (activeDocumentParam && (step.documents || []).some((item) => item.key === activeDocumentParam)
          ? activeDocumentParam
          : (((step.documents || [])[0] && step.documents[0].key) || ''));
      const stepRail = steps.map((item, index) => '<button type="button" class="' + (index === stepIndex ? '' : 'secondary') + '" data-flow-step="' + index + '">' + escapeHTML(pickText(item, 'title')) + '</button>').join('');
      const tabBar = (step.documents || []).length > 1
        ? '<div class="toolbar-row">' + (step.documents || []).map((item) => '<button type="button" class="' + (item.key === activeDocKey ? '' : 'secondary') + '" data-flow-tab="' + escapeHTML(item.key) + '">' + escapeHTML(pickText(item, 'title')) + '</button>').join('') + '</div>'
        : '';
      const panels = (step.documents || []).map((docDef) => {
        const hidden = docDef.key === activeDocKey ? '' : ' hidden';
        return '<section class="section-block' + hidden + '" data-flow-doc-key="' + escapeHTML(docDef.key) + '"><div class="section-head"><h3>' + escapeHTML(pickText(docDef, 'title')) + '</h3></div><div class="section-body">' + renderFlowDocumentDefinition(docDef, draft) + '</div></section>';
      }).join('');
      const isLast = stepIndex >= steps.length - 1;
      root.innerHTML = '<section class="page-panel"><div class="page-header"><div><h3>' + escapeHTML(pickText(flow, 'title')) + '</h3><p class="status">' + escapeHTML(pickText(step, 'title')) + '</p></div></div><div class="page-body"><div class="toolbar-row">' + stepRail + '</div>' + tabBar + '<div class="section-stack">' + panels + '</div><p class="status" id="flow-status"></p></div><div class="page-actions">' +
        '<button type="button" id="flow-back" class="secondary"' + (stepIndex === 0 ? ' disabled' : '') + '>' + escapeHTML(t('previous')) + '</button>' +
        '<button type="button" id="flow-save-local" class="secondary">' + escapeHTML(t('save_local')) + '</button>' +
        '<button type="button" id="flow-next">' + escapeHTML(isLast ? (flowDocumentID ? t('save') : t('create')) : t('next')) + '</button>' +
        '</div></section>';

      root.querySelectorAll('[data-flow-step]').forEach((button) => {
        button.addEventListener('click', async () => {
          draft = collectFlowDraft(root, draft);
          draft.step_index = parseInt(button.dataset.flowStep || '0', 10);
          draft.active_document_key = activeDocKey;
          await saveFlowDraft(flow.key, flowDocumentID, draft);
          await renderFlow(route);
        });
      });
      root.querySelectorAll('[data-flow-tab]').forEach((button) => {
        button.addEventListener('click', async () => {
          draft = collectFlowDraft(root, draft);
          draft.step_index = stepIndex;
          draft.active_document_key = button.dataset.flowTab || '';
          await saveFlowDraft(flow.key, flowDocumentID, draft);
          await renderFlow(route);
        });
      });
      root.querySelectorAll('[data-flow-doc-key] [data-path]').forEach((input) => {
        input.addEventListener('change', async () => {
          const updated = collectFlowDraft(root, draft);
          updated.step_index = stepIndex;
          updated.active_document_key = activeDocKey;
          draft = updated;
          await saveFlowDraft(flow.key, flowDocumentID, updated);
        });
      });
      const back = root.querySelector('#flow-back');
      if (back) {
        back.addEventListener('click', async () => {
          draft = collectFlowDraft(root, draft);
          draft.step_index = Math.max(0, stepIndex - 1);
          draft.active_document_key = activeDocKey;
          await saveFlowDraft(flow.key, flowDocumentID, draft);
          await renderFlow(route);
        });
      }
      const saveLocal = root.querySelector('#flow-save-local');
      if (saveLocal) {
        saveLocal.addEventListener('click', async () => {
          draft = collectFlowDraft(root, draft);
          draft.step_index = stepIndex;
          draft.active_document_key = activeDocKey;
          await saveFlowDraft(flow.key, flowDocumentID, draft);
          document.getElementById('flow-status').textContent = t('draft_saved_local');
          setStatus(t('draft_saved_local'));
        });
      }
      const next = root.querySelector('#flow-next');
      if (next) {
        next.addEventListener('click', async () => {
          draft = collectFlowDraft(root, draft);
          draft.step_index = stepIndex;
          draft.active_document_key = activeDocKey;
          await saveFlowDraft(flow.key, flowDocumentID, draft);
          const updatedSteps = resolveFlowSequence(flow, draft);
          const hasNext = stepIndex < updatedSteps.length - 1;
          if (hasNext) {
            draft.step_index = stepIndex + 1;
            await saveFlowDraft(flow.key, flowDocumentID, draft);
            await renderFlow(route);
            return;
          }
          try {
            const payload = await api('/document-flows/' + encodeURIComponent(flow.key) + '/commit', {
              method: 'POST',
              headers: {'Content-Type': 'application/json', 'X-CSRF-Token': readCookie('orbyte_csrf')},
              body: JSON.stringify({
                organization_id: 'org_default',
                primary_document_id: flowDocumentID || '',
                documents: Object.keys(draft.documents || {}).reduce((result, key) => {
                  result[key] = (draft.documents[key] && draft.documents[key].payload) || {};
                  return result;
                }, {})
              })
            });
            await idbDelete('drafts', draftKey('document_flow', flow.key, flowDocumentID || ''));
            delete state.flowTabs[flowDraftStateKey(flow.key, flowDocumentID)];
            const detailRoute = routeForDocument(payload.primary_document_type, 'detail');
            if (detailRoute && payload.primary_document_id) {
              window.location.hash = '#' + detailRoute + '?id=' + encodeURIComponent(payload.primary_document_id);
              return;
            }
            document.getElementById('flow-status').textContent = t('record_created');
            setStatus(t('record_created'));
          } catch (err) {
            document.getElementById('flow-status').textContent = err.message;
            setStatus(err.message);
          }
        });
      }
    }

    async function renderCustom(route) {
