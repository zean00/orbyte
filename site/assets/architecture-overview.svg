<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Orbyte Architecture Overview</title>
  <desc id="desc">High-level architecture showing external users and systems connecting to HTTP APIs and MCP, then to the Orbyte kernel, business modules, async runtime, and infrastructure dependencies.</desc>
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
      .box2 { fill: #eef6ff; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
      .box3 { fill: #eefbf3; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
      .box4 { fill: #fff7e8; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
      .label { font: 600 22px sans-serif; fill: #111827; }
      .small { font: 400 16px sans-serif; fill: #374151; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="700"/>

  <rect class="box" x="400" y="30" width="380" height="70"/>
  <text class="label" x="590" y="72" text-anchor="middle">Users and External Systems</text>

  <rect class="box2" x="410" y="150" width="360" height="80"/>
  <text class="label" x="590" y="190" text-anchor="middle">HTTP APIs and MCP</text>
  <text class="small" x="590" y="215" text-anchor="middle">browser, apps, services, agents</text>

  <rect class="box2" x="360" y="290" width="460" height="110"/>
  <text class="label" x="590" y="335" text-anchor="middle">Orbyte Kernel</text>
  <text class="small" x="590" y="362" text-anchor="middle">identity, config, policy, integration, search, reporting</text>

  <rect class="box3" x="70" y="470" width="290" height="100"/>
  <text class="label" x="215" y="515" text-anchor="middle">Business Modules</text>
  <text class="small" x="215" y="542" text-anchor="middle">models, documents, workflows, UI, tools</text>

  <rect class="box3" x="445" y="470" width="290" height="100"/>
  <text class="label" x="590" y="515" text-anchor="middle">Async Runtime</text>
  <text class="small" x="590" y="542" text-anchor="middle">jobs, outbox, retries, projections</text>

  <rect class="box4" x="820" y="450" width="280" height="60"/>
  <text class="label" x="960" y="487" text-anchor="middle">PostgreSQL</text>

  <rect class="box4" x="820" y="530" width="280" height="60"/>
  <text class="label" x="960" y="567" text-anchor="middle">Typesense / NATS</text>

  <rect class="box4" x="820" y="610" width="280" height="60"/>
  <text class="label" x="960" y="647" text-anchor="middle">SMTP / Object Store</text>

  <path class="arrow" d="M590 100 L590 150"/>
  <path class="arrow" d="M590 230 L590 290"/>
  <path class="arrow" d="M520 400 L265 470"/>
  <path class="arrow" d="M590 400 L590 470"/>
  <path class="arrow" d="M660 400 L960 450"/>
  <path class="arrow" d="M735 520 L820 520"/>
  <path class="arrow" d="M735 550 L820 560"/>
  <path class="arrow" d="M735 580 L820 640"/>
</svg>
