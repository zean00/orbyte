services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orbyte
      POSTGRES_PASSWORD: orbyte
      POSTGRES_DB: orbyte
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbyte -d orbyte"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_ADDRESS: :8080
      APP_JWT_SECRET: dev-secret
      APP_BOOTSTRAP_ADMIN_PASSWORD: admin123!
      DATABASE_URL: postgres://orbyte:orbyte@postgres:5432/orbyte?sslmode=disable
    ports:
      - "8080:8080"

volumes:
  postgres-data:
